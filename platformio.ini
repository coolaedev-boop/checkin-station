; Check-in station: ESP32-S3-N16R8 + 4" ST7796S SPI touch display
[env:station]
platform = espressif32@7.1.3              ; pinned: Arduino core 2.0.17
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 = 16 MB flash + 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs          ; item images live in data/items/

build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DLV_CONF_INCLUDE_SIMPLE
  -Iinclude
  ; -DARDUINO_USB_CDC_ON_BOOT=1   ; uncomment if Serial Monitor is silent on the native USB port

monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF

; Exact versions: the build you test is the build you flash. Bump on purpose, not by accident.
lib_deps =
  h2zero/NimBLE-Arduino@2.5.1
  lvgl/lvgl@9.2.2
  lovyan03/LovyanGFX@1.2.31
  bblanchon/ArduinoJson@7.4.3
